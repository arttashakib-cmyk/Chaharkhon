
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            echo "Extracting: $ZIP"
            mkdir -p work
            unzip -q "$ZIP" -d work
            ROOT="work"
          else
            ROOT="."
          fi

          PROJECT=$(dirname "$(find "$ROOT" -name settings.gradle.kts -print -quit)")

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Temporary Kotlin compatibility fix
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          find "$PROJECT_DIR/app/src" -type f -name "*.kt" \
            -exec sed -i 's/setCurrent(/updateCurrent(/g' {} +

          echo "Temporary patch applied."
          echo "Original repository files remain unchanged."

      - name: Build Debug APK
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Build Release APK
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaharchin-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
